name: smart_interest_x
description: SmartInterestX - Loan & Interest Management Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+4
  sqflite_common_ffi_web: ^0.4.5+2
  path: ^1.9.0

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # File Handling & Export
  csv: ^6.0.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  permission_handler: ^11.3.1

  # Image Picker (payment proof)
  image_picker: ^1.1.2

  # Date formatting
  intl: ^0.19.0

  # Shared Preferences
  shared_preferences: ^2.3.3

  # UUID generation
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
